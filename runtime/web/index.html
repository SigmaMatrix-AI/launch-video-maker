<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launch Video Maker · Preview</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9e9ed;background:#111215}
#app-header,#app-header *,#controls,#controls *,#error{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:flex;flex-direction:column}
#app-header{height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #ffffff0d;background:#17181c}
#app-header .identity{display:flex;gap:13px;align-items:center;font-size:14px;font-weight:600;letter-spacing:-.2px}#app-header .mark{width:27px;height:27px;display:grid;place-items:center;background:#c4ee8f;color:#172311;border-radius:8px;font-size:12px}#app-header .badge{font-size:11px;color:#a8abb5;border:1px solid #35373f;border-radius:5px;padding:3px 7px;font-weight:500;letter-spacing:.3px}#spec{font-size:12px;color:#858995;font-variant-numeric:tabular-nums}
#viewport{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#23252c,#111215 80%)}
#canvas-shell{position:relative;flex-shrink:0;box-shadow:0 16px 65px #0006}#stage{position:relative;overflow:hidden;transform-origin:top left;isolation:isolate;background:#000}
#controls{flex-shrink:0;min-height:86px;display:grid;grid-template-columns:auto minmax(80px,1fr) auto;align-items:center;gap:26px;padding:18px 28px;border-top:1px solid #ffffff0d;background:#17181c}
.transport{display:flex;align-items:center;gap:8px}#controls button{font:inherit;font-size:13px;font-weight:500;cursor:pointer;border:1px solid #363943;border-radius:8px;padding:0 14px;min-height:38px;color:#dadce3;background:#23252c}#controls button:hover{background:#30333d;border-color:#555a68}#controls button:focus-visible,#controls input:focus-visible{outline:2px solid #c4ee8f;outline-offset:4px}#play{min-width:80px;background:#c4ee8f;border-color:#c4ee8f;color:#182510;font-weight:650}#play:hover{background:#d5f6ae}
#seek{width:100%;min-width:0;accent-color:#c4ee8f;cursor:pointer;height:20px;margin:0}#time{font-size:12px;color:#a0a5b2;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:166px;text-align:right}
#error:empty{display:none}#error{flex-shrink:0;color:#ffc0b8;background:#37201f;border-top:1px solid #65352f;white-space:pre-wrap;padding:12px 28px;font-size:13px}
.capture #app-header,.capture #error{display:none}.capture #viewport{display:block;overflow:visible;background:none}.capture #canvas-shell{width:auto;height:auto;box-shadow:none}.capture #stage{transform:none!important}
@media(max-width:760px){#app-header{padding:0 18px}#app-header .badge{display:none}#controls{padding:14px 18px;gap:12px;grid-template-columns:auto 1fr}#seek{grid-column:1/-1;grid-row:1}#time{min-width:0}#spec{font-size:10px}}
</style>
</head>
<body>
<header id="app-header"><div class="identity"><span class="mark" aria-hidden="true">▶</span>Launch Video Maker<span class="badge">PREVIEW</span></div><span id="spec"></span></header>
<main id="viewport" aria-label="Film preview"><div id="canvas-shell"><div id="stage"></div></div></main>
<div id="controls"><div class="transport"><button id="play" type="button">Play</button><button id="prev" type="button" aria-label="Previous frame" title="Previous frame">−1</button><button id="next" type="button" aria-label="Next frame" title="Next frame">+1</button></div><input id="seek" aria-label="Playback position" type="range" min="0" value="0"><span id="time"></span></div>
<div id="error" role="alert"></div>
<script type="module" src="/main.tsx"></script>
</body>
</html>
