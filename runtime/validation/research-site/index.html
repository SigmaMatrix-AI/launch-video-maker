<!doctype html><html lang="zh"><meta charset="utf-8"><title>Gather — 虚构产品研究夹具</title><style>body{font:20px system-ui;max-width:1000px;margin:auto;padding:32px;color:#183142}nav{display:flex;gap:28px}section{padding:80px 0;border-bottom:1px solid #ccc}button{padding:16px;font:inherit}pre{white-space:pre-wrap;background:#eef4f5;padding:30px}</style><nav><a href="features.html">产品功能</a><a href="case.html">客户案例</a><a href="careers.html">招聘</a></nav><section style="min-height:80vh"><small>研究测试用虚构产品</small><h1>让团队找到共同的答案</h1><p>Gather，连接你的工作知识。</p></section><section><h2>搜索、总结、分享</h2><p>在已连接的资料中搜索，由用户选择资料生成摘要，分享给有权限的同事。</p><a href="features.html">查看操作与限制</a></section><section><h2>看看实际结果</h2><button id="summary">摘要示例</button> <button id="sources">来源示例</button><pre id="sample">选择上方示例查看内容。</pre><a href="case.html">完整案例</a></section><section id="late"><h2>正在加载使用范围</h2></section><footer><a href="restricted.html">登录工作台（测试中不可用）</a></footer><script>document.querySelector('#summary').onclick=()=>{document.querySelector('#sample').textContent='虚构演示：发布准备摘要\n设计完成；上线日期待确认。此摘要来自用户选择的两份文档。';history.replaceState(null,'','#summary');};document.querySelector('#sources').onclick=()=>{document.querySelector('#sample').textContent='虚构演示：每个摘要要点保留对应来源链接，可返回原文核对。';history.replaceState(null,'','#sources');};new IntersectionObserver((entries,o)=>{if(entries[0].isIntersecting){document.querySelector('#late').innerHTML='<h2>权限沿用原资料</h2><p>分享不会扩大原有资料权限。接收者需具备相应访问权。</p>';o.disconnect();}}).observe(document.querySelector('#late'));</script></html>
